# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
commons-math3 = "3.6.1"
guava = "33.3.1-jre"
guice = "7.0.0"
junit-jupiter = "5.11.3"
cucumber = "7.20.1"
mockito = "5.17.0"
lombok-plugin = "9.8.2"
slf4j-api = "2.0.17"
logback-classic = "1.6.7"
jackson = "2.21.8"
nats = "2.21.1"
testcontainers = "2.0.5"
quarkus = "3.40.1.2"
quarkus-web-bundler = "3.0.0"
web-bundler-native-plugin = "1.0.0"

[libraries]
commons-math3 = { module = "org.apache.commons:commons-math3", version.ref = "commons-math3" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
guice = { module = "com.google.inject:guice", version.ref = "guice" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-jupiter" }
junit-platform-suite = { module = "org.junit.platform:junit-platform-suite" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
cucumber-java = { module = "io.cucumber:cucumber-java", version.ref = "cucumber" }
cucumber-junit-platform-engine = { module = "io.cucumber:cucumber-junit-platform-engine", version.ref = "cucumber" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j-api" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback-classic" }

# Independently selected for lib; no dependency on the Quarkus platform.
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }

# Jackson dependencies
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }
jackson-module-parameter-names = { module = "com.fasterxml.jackson.module:jackson-module-parameter-names" }

# NATS JetStream dependencies
nats-client = { module = "io.nats:jnats", version.ref = "nats" }

# Quarkus dependencies
quarkus-bom = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus" }
quarkus-arc = { module = "io.quarkus:quarkus-arc" }
quarkus-rest = { module = "io.quarkus:quarkus-rest" }
quarkus-junit5 = { module = "io.quarkus:quarkus-junit5" }
quarkus-web-bundler = { module = "io.quarkiverse.web-bundler:quarkus-web-bundler", version.ref = "quarkus-web-bundler" }
rest-assured = { module = "io.rest-assured:rest-assured" }

[plugins]
web-bundler-native = { id = "io.mvnpm.gradle.plugin.native-java-plugin", version.ref = "web-bundler-native-plugin" }
lombok = { id = "io.freefair.lombok", version.ref = "lombok-plugin" }
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
