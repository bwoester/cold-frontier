# Based on https://github.com/actions/starter-workflows/blob/main/ci/gradle.yml
name: Java CI with Gradle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test lib
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Build with Gradle Wrapper
        run: bash gradlew :lib:build :lib:integrationTest --console=plain --warning-mode=all
      - name: Summarize test results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: |
            lib/build/test-results/test/TEST-*.xml
            lib/build/test-results/acceptanceTest/TEST-*.xml
            lib/build/test-results/integrationTest/TEST-*.xml
          check_name: |
            Unit and characterization tests
            Acceptance tests
            Integration tests
          detailed_summary: 'true'
          include_passed: 'true'
          include_skipped: 'true'
          skip_annotations: 'true'
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lib-test-reports
          path: |
            lib/build/reports/tests/test
            lib/build/test-results/test
            lib/build/reports/tests/acceptanceTest
            lib/build/test-results/acceptanceTest
            lib/build/reports/tests/integrationTest
            lib/build/test-results/integrationTest
