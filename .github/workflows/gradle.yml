# Based on https://github.com/actions/starter-workflows/blob/main/ci/gradle.yml
name: Java CI with Gradle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test lib
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Build with Gradle Wrapper
        run: bash gradlew :lib:build :lib:integrationTest --console=plain
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lib-test-reports
          path: |
            lib/build/reports/tests/test
            lib/build/test-results/test
            lib/build/reports/tests/integrationTest
            lib/build/test-results/integrationTest
